<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Crono</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <img src="fond.jpg" alt="Voyage a le plage">
    <h1>Tirage au sort</h1>
    <p>Remporter un voyage gratuit pour deux personne  a Awai</p>


    <div class="time-content">
        <div class="time jours">
            <div class="number">00</div>
            <div class="text">Jours</div>
        </div>
        <div class="time heure">
            <div class="number">00</div>
            <div class="text">Heure</div>
        </div>
        <div class="time minute">
            <div class="number">00</div>
            <div class="text">Minute</div>
        </div>
        <div class="time seconde">
            <div class="number">00</div>
            <div class="text">Seconde</div>
        </div>
    </div>
    <div class="email">
      <p>Inscrivez-vous pour participer au concour </p>
      <div class="input-box">
          <input type="text" placeholder="indiquez votre Email">
          <button>S'inscrire</button>
      </div>
   </div>

</div>
<script src="script.js"></script>
</body>
</html>
